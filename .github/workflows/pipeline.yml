name: CI/CD
on:
  push:
    branches: ["main"]
jobs:
  build-job:
    name: Build docker image
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Step 2 - Build docker image
        run: docker build -t ipod-classic-image .

  deploy-job:
    name: Deploy to server
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Deploy proyect
        run: docker run -d -P ipod-classic-image
