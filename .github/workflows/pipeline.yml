name: nombre del pipeline
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  echo-job:
    name: Run Echo Commad
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Step 1 - B  asic Echo
        run: echo "Hello! This is a simple GitHub Actions pipeline."

      - name: Step Build image
        run: docker build -t ipod-classic-image .

      - name: Step 2 - Echo Current Date
        run: 'echo "The current date and time is: $(date)"'
